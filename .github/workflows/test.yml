name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test --coverage

      - name: Type check
        run: bun run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=150

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify LICENSE immutable fields unchanged
        run: |
          # The project uses the standard MIT license (adopted deliberately); these
          # fields must NEVER change without an explicit relicensing decision.

          if ! grep -q "MIT License" LICENSE; then
            echo "❌ ERROR: LICENSE is no longer the MIT License!"
            exit 1
          fi

          if ! grep -q "Copyright (c) 2026 Alexandria Eden" LICENSE; then
            echo "❌ ERROR: copyright holder line has been modified!"
            echo "Must remain: 'Copyright (c) 2026 Alexandria Eden'"
            exit 1
          fi

          echo "✅ LICENSE immutable fields are correct"
          echo "   - MIT License"
          echo "   - Copyright (c) 2026 Alexandria Eden"
