name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Backstop. Without it a hung step blocks the release until GitHub's 6-hour job cap,
    # and nothing in this job is legitimately slow enough to need more than half an hour.
    timeout-minutes: 30
    # Skip release for commits that are just version bumps
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # THIS IS THE GATE. It was advisory until 2026-07-26 (`bun test || true` plus
      # `continue-on-error: true`) under a comment claiming "the Tests workflow is the real
      # gate". That claim was false: test.yml runs on push, release.yml is
      # workflow_dispatch and never depended on it, so nothing stopped a release on a red
      # suite — v18.72.6 reached npm while this very step reported failure.
      #
      # A hang must block too, rather than be swallowed; that was the other half of the old
      # problem. timeout-minutes bounds it, and without continue-on-error a timeout now
      # fails the release instead of quietly costing 20 minutes. 20 minutes against a
      # ~9-minute local suite leaves headroom for a slower runner without inviting a hang.
      - name: Run tests (release gate)
        run: bun test
        timeout-minutes: 20

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npx release-it --ci --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: github.event.inputs.dry_run != 'true'
        run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
