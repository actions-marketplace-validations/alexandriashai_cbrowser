name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Backstop. Without it a hung step blocks the release until GitHub's 6-hour job cap,
    # and nothing in this job is legitimately slow enough to need more than half an hour.
    timeout-minutes: 30
    # Skip release for commits that are just version bumps
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Advisory only — the Tests workflow is the real gate and runs the same suite with
      # coverage on every push. `|| true` was already here to keep a test failure from
      # blocking a release, but it does nothing about a HANG: on 2026-07-25 this step ran
      # ~20 minutes against the same suite the Tests workflow finished in 5m45s, turning a
      # release into a 26-minute job. The two settings below give the stated intent teeth
      # in both directions — bounded, and non-blocking whether it fails OR times out.
      - name: Run tests
        run: bun test || true
        timeout-minutes: 10
        continue-on-error: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npx release-it --ci --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: github.event.inputs.dry_run != 'true'
        run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
